<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escalas de Trabalho</title>
    
    <!-- Leaflet CSS para o Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-color: #000000;
            --card-color: #1A1A1A;
            --text-color: #FFFFFF;
            --text-muted: #A0A0A0;
            --accent-color: #D4FF00; /* Amarelo Limão */
            --accent-hover: #b3d900;
            --danger-color: #FF3366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: #000000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: var(--card-color);
            color: var(--danger-color);
            border: 2px solid var(--danger-color);
        }

        .btn-danger:hover {
            background-color: var(--danger-color);
            color: #ffffff;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #0d0d0d;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .escala-card {
            background-color: #0d0d0d;
            border-left: 4px solid var(--accent-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .escala-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .escala-details {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .escala-marcacoes {
            font-size: 13px;
            font-weight: bold;
            color: var(--accent-color);
            background-color: #1A1A1A;
            padding: 6px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 4px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .status-on { background-color: var(--accent-color); color: #000; }
        .status-off { background-color: #333; color: #fff; }

        /* Estilos do Mapa */
        .map-container {
            height: 250px;
            width: 100%;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            z-index: 1;
            border: 2px solid #333;
            background-color: #222;
        }

        /* TRUQUE CSS: Inverte as cores do mapa padrão para criar um Dark Mode */
        .leaflet-tile {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        /* Animação do pino piscando (Amarelo Limão) */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 255, 0, 0.7); }
            70% { transform: scale(1.5); box-shadow: 0 0 0 15px rgba(212, 255, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 255, 0, 0); }
        }

        .live-marker {
            background-color: var(--accent-color);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #000;
            animation: pulse 1.5s infinite;
        }

        /* Estilo para flexbox dos campos de hora */
        .row-horas {
            display: flex;
            gap: 12px;
        }
        .row-horas > div {
            flex: 1;
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="view-login" class="container view-section active">
        <h1>Escalas de Trabalho</h1>
        <p style="text-align: center; color: #A0A0A0; margin-bottom: 24px;">Quem está acessando?</p>
        <button class="btn" onclick="selectProfile('thiago')">Thiago 🖤</button>
        <button class="btn btn-outline" onclick="selectProfile('namorada')">Andreza 🤍</button>
    </div>

    <!-- TELA DO THIAGO -->
    <div id="view-thiago" class="container view-section">
        <h2>Painel do Thiago</h2>
        
        <div style="text-align: center;">
            <div id="location-status" class="status-badge status-off">Localização Oculta</div>
            
            <!-- Mapa do Thiago -->
            <div id="map-thiago" class="map-container"></div>

            <button id="btn-toggle-location" class="btn" onclick="toggleLocation()">Transmitir Ao Vivo</button>
        </div>

        <hr style="border-color: #333; margin: 24px 0;">

        <form id="form-escala" onsubmit="salvarEscala(event)">
            <h3 id="titulo-form-escala">Nova Escala</h3>
            <br>
            
            <label for="tipo">Tipo de Escala</label>
            <select id="tipo" required>
                <option value="" disabled selected>Selecione o tipo...</option>
                <option value="Ordinária">Ordinária</option>
                <option value="Extra">Extra</option>
                <option value="Extra IDV">Extra IDV</option>
                <option value="Plantão">Plantão</option>
                <option value="Plantão Blitz">Plantão Blitz</option>
                <option value="Pnatrans">Pnatrans</option>
                <option value="Compensação">Compensação</option>
                <option value="Banco de Horas">Banco de Horas</option>
            </select>

            <label for="data">Data</label>
            <input type="date" id="data" required>

            <label for="hora">Horário Previsto</label>
            <input type="time" id="hora" required>

            <div class="row-horas">
                <div>
                    <label for="horaEntrada" style="color: #4CAF50;">Entrada Real</label>
                    <input type="time" id="horaEntrada">
                </div>
                <div>
                    <label for="horaSaida" style="color: #FF3366;">Saída Real</label>
                    <input type="time" id="horaSaida">
                </div>
            </div>

            <button type="submit" id="btn-submit-escala" class="btn">Cadastrar Escala</button>
            <button type="button" id="btn-cancelar-edicao" class="btn btn-outline" style="display: none;" onclick="cancelarEdicao()">Cancelar Edição</button>
        </form>

        <hr style="border-color: #333; margin: 24px 0;">
        
        <h3>Minhas Escalas</h3>
        <br>
        <div id="lista-escalas-thiago">
            <p style="color: #A0A0A0; text-align: center;">Carregando escalas...</p>
        </div>

        <button class="btn btn-danger" onclick="logout()" style="margin-top: 24px;">Sair</button>
    </div>

    <!-- TELA DA NAMORADA -->
    <div id="view-namorada" class="container view-section">
        <h2>Painel de Andreza</h2>
        
        <div style="background-color: #0d0d0d; padding: 16px; border-radius: 8px; margin-bottom: 24px; text-align: center;">
            <p style="color: #A0A0A0; margin-bottom: 8px; font-size: 14px;">Localização do Thiago</p>
            <div id="namorada-loc-status" class="status-badge status-off">Aguardando atualização...</div>
            
            <!-- Mapa da Namorada -->
            <div id="map-namorada" class="map-container"></div>
        </div>

        <h3>Próximas Escalas</h3>
        <br>
        <div id="lista-escalas">
            <p style="color: #A0A0A0; text-align: center;">Carregando escalas...</p>
        </div>

        <button class="btn btn-danger" onclick="logout()" style="margin-top: 24px;">Sair</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- IMPORTAÇÃO DO FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, setDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB6YUQRMOmkLAIaVa68UTkb06lDCrjZckY",
            authDomain: "escalas-thiago.firebaseapp.com",
            databaseURL: "https://escalas-thiago-default-rtdb.firebaseio.com",
            projectId: "escalas-thiago",
            storageBucket: "escalas-thiago.firebasestorage.app",
            messagingSenderId: "479249384716",
            appId: "1:479249384716:web:fdf75c01d8e58ef0347529",
            measurementId: "G-NK9L1ZCZ2K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let watchId = null;
        let escalaEditandoId = null; 
        
        let mapNamorada = null;
        let markerNamorada = null;
        let mapThiago = null;
        let markerThiago = null;

        const pulsingIcon = L.divIcon({
            className: 'custom-div-icon',
            html: '<div class="live-marker"></div>',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        const freeTileUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
        const tileAttribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';

        window.selectProfile = function(profile) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${profile}`).classList.add('active');
            
            carregarEscalas();

            if(profile === 'namorada') {
                escutarLocalizacao();
            }
        };

        window.logout = function() {
            if(watchId) {
                navigator.geolocation.clearWatch(watchId);
                atualizarStatusLocalizacaoFirestore(false, null, null);
            }
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-login').classList.add('active');
        };

        // =========================================================
        // FUNÇÕES DO THIAGO (Salvar, Editar, Excluir e Transmitir)
        // =========================================================
        window.salvarEscala = async function(event) {
            event.preventDefault();
            const tipo = document.getElementById('tipo').value;
            const data = document.getElementById('data').value;
            const hora = document.getElementById('hora').value;
            const horaEntrada = document.getElementById('horaEntrada').value;
            const horaSaida = document.getElementById('horaSaida').value;

            try {
                if (escalaEditandoId) {
                    await updateDoc(doc(db, "escalas", escalaEditandoId), {
                        tipo: tipo,
                        data: data,
                        hora: hora,
                        horaEntrada: horaEntrada,
                        horaSaida: horaSaida
                    });
                    alert("Escala atualizada com sucesso!");
                    cancelarEdicao(); 
                } else {
                    await addDoc(collection(db, "escalas"), {
                        tipo: tipo,
                        data: data,
                        hora: hora,
                        horaEntrada: horaEntrada,
                        horaSaida: horaSaida,
                        timestamp: new Date().getTime()
                    });
                    alert("Escala cadastrada com sucesso!");
                    event.target.reset();
                }
            } catch (e) {
                console.error("Erro ao salvar: ", e);
                alert("Erro ao salvar. Verifique as permissões do banco de dados.");
            }
        };

        window.editarEscala = function(id, tipo, data, hora, entrada, saida) {
            document.getElementById('tipo').value = tipo;
            document.getElementById('data').value = data;
            document.getElementById('hora').value = hora;
            document.getElementById('horaEntrada').value = entrada !== 'undefined' ? entrada : '';
            document.getElementById('horaSaida').value = saida !== 'undefined' ? saida : '';
            
            escalaEditandoId = id;
            
            document.getElementById('titulo-form-escala').textContent = "Editando Escala";
            document.getElementById('btn-submit-escala').textContent = "Atualizar Escala";
            document.getElementById('btn-cancelar-edicao').style.display = "block";
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelarEdicao = function() {
            escalaEditandoId = null;
            document.getElementById('form-escala').reset();
            document.getElementById('titulo-form-escala').textContent = "Nova Escala";
            document.getElementById('btn-submit-escala').textContent = "Cadastrar Escala";
            document.getElementById('btn-cancelar-edicao').style.display = "none";
        };

        window.excluirEscala = async function(id) {
            const confirmar = confirm("Tem certeza que deseja excluir esta escala?");
            if (confirmar) {
                try {
                    await deleteDoc(doc(db, "escalas", id));
                    if (escalaEditandoId === id) {
                        cancelarEdicao();
                    }
                } catch (e) {
                    console.error("Erro ao excluir: ", e);
                    alert("Erro ao excluir a escala.");
                }
            }
        };

        window.toggleLocation = function() {
            const btn = document.getElementById('btn-toggle-location');
            const statusBadge = document.getElementById('location-status');
            const mapContainer = document.getElementById('map-thiago');

            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                btn.textContent = "Transmitir Ao Vivo";
                btn.className = "btn";
                statusBadge.textContent = "Localização Oculta";
                statusBadge.className = "status-badge status-off";
                mapContainer.style.display = "none";
                atualizarStatusLocalizacaoFirestore(false, null, null);
                
                if(mapThiago) {
                    mapThiago.remove();
                    mapThiago = null;
                    markerThiago = null;
                }
            } else {
                if (navigator.geolocation) {
                    btn.textContent = "Parar Transmissão";
                    btn.className = "btn btn-danger";
                    statusBadge.textContent = "Transmitindo ao vivo...";
                    statusBadge.className = "status-badge status-on";
                    mapContainer.style.display = "block";
                    
                    watchId = navigator.geolocation.watchPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            
                            atualizarStatusLocalizacaoFirestore(true, lat, lng);
                            atualizarMapaThiago(lat, lng);
                        },
                        (error) => {
                            alert("Erro ao obter localização. Verifique o GPS.");
                            console.error(error);
                        },
                        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                    );
                } else {
                    alert("Geolocalização não suportada.");
                }
            }
        };

        function atualizarMapaThiago(lat, lng) {
            if (!mapThiago) {
                mapThiago = L.map('map-thiago').setView([lat, lng], 16);
                L.tileLayer(freeTileUrl, { attribution: tileAttribution }).addTo(mapThiago);
                markerThiago = L.marker([lat, lng], {icon: pulsingIcon}).addTo(mapThiago);
                
                setTimeout(() => { mapThiago.invalidateSize(); }, 100);
            } else {
                const newPos = new L.LatLng(lat, lng);
                markerThiago.setLatLng(newPos);
                mapThiago.panTo(newPos);
            }
        }

        async function atualizarStatusLocalizacaoFirestore(ativo, lat, lng) {
            try {
                await setDoc(doc(db, "status_thiago", "localizacao"), {
                    ativo: ativo,
                    latitude: lat,
                    longitude: lng,
                    atualizadoEm: new Date().getTime()
                });
            } catch (e) {
                console.error("Erro ao atualizar localização: ", e);
            }
        }

        // =========================================================
        // FUNÇÃO COMPARTILHADA (Ler Escalas)
        // =========================================================
        function carregarEscalas() {
            const q = query(collection(db, "escalas"), orderBy("data", "desc"));
            
            onSnapshot(q, (snapshot) => {
                const listaAndreza = document.getElementById('lista-escalas');
                const listaThiago = document.getElementById('lista-escalas-thiago');
                
                listaAndreza.innerHTML = "";
                listaThiago.innerHTML = "";
                
                if(snapshot.empty) {
                    listaAndreza.innerHTML = "<p style='color: #A0A0A0; text-align: center;'>Nenhuma escala cadastrada.</p>";
                    listaThiago.innerHTML = "<p style='color: #A0A0A0; text-align: center;'>Nenhuma escala cadastrada.</p>";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const dados = docSnap.data();
                    const id = docSnap.id;
                    
                    const dataObj = new Date(dados.data + 'T00:00:00');
                    const dataFormatada = dataObj.toLocaleDateString('pt-BR');

                    // Construção do indicador de Ponto (Entrada/Saída)
                    let marcacoesHTML = "";
                    if (dados.horaEntrada || dados.horaSaida) {
                        const txtEntrada = dados.horaEntrada ? `🟢 Início: ${dados.horaEntrada}` : `🟢 Início: --:--`;
                        const txtSaida = dados.horaSaida ? `🔴 Fim: ${dados.horaSaida}` : `🔴 Fim: --:--`;
                        marcacoesHTML = `<div class="escala-marcacoes">${txtEntrada} &nbsp;|&nbsp; ${txtSaida}</div>`;
                    } else {
                        marcacoesHTML = `<div class="escala-marcacoes" style="color: #A0A0A0;">⏳ Aguardando início...</div>`;
                    }

                    // Cartão Andreza
                    const cardAndreza = document.createElement('div');
                    cardAndreza.className = 'escala-card';
                    cardAndreza.innerHTML = `
                        <div class="escala-title">${dados.tipo}</div>
                        <div class="escala-details">📅 ${dataFormatada} às ⏰ ${dados.hora} (Previsto)</div>
                        ${marcacoesHTML}
                    `;
                    listaAndreza.appendChild(cardAndreza);

                    // Cartão Thiago
                    const cardThiago = document.createElement('div');
                    cardThiago.className = 'escala-card';
                    cardThiago.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div>
                                <div class="escala-title">${dados.tipo}</div>
                                <div class="escala-details">📅 ${dataFormatada} às ⏰ ${dados.hora}</div>
                                ${marcacoesHTML}
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">
                                <button onclick="editarEscala('${id}', '${dados.tipo}', '${dados.data}', '${dados.hora}', '${dados.horaEntrada || ''}', '${dados.horaSaida || ''}')" style="background: none; border: none; color: var(--accent-color); font-size: 14px; font-weight: bold; cursor: pointer; text-decoration: underline; text-align: right;">Editar</button>
                                <button onclick="excluirEscala('${id}')" style="background: none; border: none; color: var(--danger-color); font-size: 14px; font-weight: bold; cursor: pointer; text-decoration: underline; text-align: right;">Excluir</button>
                            </div>
                        </div>
                    `;
                    listaThiago.appendChild(cardThiago);
                });
            });
        }

        // =========================================================
        // FUNÇÃO DA ANDREZA (Escutar Localização)
        // =========================================================
        function escutarLocalizacao() {
            onSnapshot(doc(db, "status_thiago", "localizacao"), (docSnap) => {
                const statusBadge = document.getElementById('namorada-loc-status');
                const mapContainer = document.getElementById('map-namorada');

                if (docSnap.exists()) {
                    const dados = docSnap.data();
                    
                    if (dados.ativo) {
                        statusBadge.textContent = "Ao Vivo agora";
                        statusBadge.className = "status-badge status-on";
                        mapContainer.style.display = "block";

                        if (!mapNamorada) {
                            mapNamorada = L.map('map-namorada').setView([dados.latitude, dados.longitude], 16);
                            L.tileLayer(freeTileUrl, { attribution: tileAttribution }).addTo(mapNamorada);
                            markerNamorada = L.marker([dados.latitude, dados.longitude], {icon: pulsingIcon}).addTo(mapNamorada);
                            
                            setTimeout(() => { mapNamorada.invalidateSize(); }, 100);
                        } else {
                            const newPos = new L.LatLng(dados.latitude, dados.longitude);
                            markerNamorada.setLatLng(newPos);
                            mapNamorada.panTo(newPos);
                        }
                    } else {
                        statusBadge.textContent = "Transmissão Desligada";
                        statusBadge.className = "status-badge status-off";
                        mapContainer.style.display = "none";
                        
                        if(mapNamorada) {
                            mapNamorada.remove();
                            mapNamorada = null;
                            markerNamorada = null;
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
